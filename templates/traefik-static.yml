entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
    proxyProtocol:
      trustedIPs: ${TRAEFIK_TRUSTED_IPS}
    forwardedHeaders:
      trustedIPs: ${TRAEFIK_TRUSTED_IPS}
providers:
  file:
    filename: "/etc/traefik/dynamic.yml"
    watch: true
log:
  level: INFO
ping: {}
api:
  dashboard: true
