version: "3.9"

# Upstream references:
# - Postal installation guide: https://docs.postalserver.io/getting-started/installation
# - Postal repo: https://github.com/postalserver
# - ERPNext upstream: https://github.com/frappe/erpnext
# - ERPNext Docker deployment repo: https://github.com/frappe/frappe_docker

services:
  traefik:
    image: traefik:v3.1
    container_name: ${BASM_CONTAINER_PREFIX}-traefik
    restart: unless-stopped
    command:
      - --configfile=/etc/traefik/static.yml
    ports:
      - "${BIND_ADDRESS}:${HTTP_PORT}:80"
      - "${BIND_ADDRESS}:${HTTPS_PORT}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${BASM_ROOT}/config/traefik.yml:/etc/traefik/dynamic.yml:ro
      - ${BASM_ROOT}/config/traefik-static.yml:/etc/traefik/static.yml:ro
      - ${BASM_ROOT}/data/traefik:/data
    networks:
      - basm-net

  erpnext:
    image: frappe/erpnext:latest
    container_name: ${BASM_CONTAINER_PREFIX}-erpnext
    restart: unless-stopped
    environment:
      DB_ROOT_PASSWORD: changeme
      MYSQL_ROOT_PASSWORD: changeme
    volumes:
      - ${BASM_ROOT}/data/erpnext:/home/frappe/frappe-bench/sites
    networks:
      - basm-net
    # Follow upstream ERPNext deployment guidance from:
    # https://github.com/frappe/erpnext
    # https://github.com/frappe/frappe_docker

  postal:
    image: ghcr.io/postalserver/postal:latest
    container_name: ${BASM_CONTAINER_PREFIX}-postal
    restart: unless-stopped
    environment:
      POSTAL_HOSTNAME: ${MAIL_URL}
    networks:
      - basm-net
    # Follow upstream Postal installation guidance from:
    # https://docs.postalserver.io/getting-started/installation
    # https://github.com/postalserver

  nextcloud:
    image: nextcloud:latest
    container_name: ${BASM_CONTAINER_PREFIX}-nextcloud
    restart: unless-stopped
    environment:
      NEXTCLOUD_TRUSTED_DOMAINS: "${CLOUD_URL} localhost 127.0.0.1 ${BIND_ADDRESS}"
    volumes:
      - ${BASM_ROOT}/data/nextcloud:/var/www/html
    networks:
      - basm-net

  restic:
    image: alpine:3.20
    container_name: ${BASM_CONTAINER_PREFIX}-restic
    restart: unless-stopped
    volumes:
      - ${BASM_ROOT}/data/restic:/data
      - ${BACKUP_LOCATION}:/backup
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
    networks:
      - basm-net

networks:
  basm-net:
    driver: bridge
