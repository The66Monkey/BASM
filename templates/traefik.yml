http:
  routers:
    erp:
      rule: "Host(`${ERP_URL}`)"
      service: erp-service
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
    mail:
      rule: "Host(`${MAIL_URL}`)"
      service: mail-service
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
    cloud:
      rule: "Host(`${CLOUD_URL}`)"
      service: cloud-service
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt

  services:
    erp-service:
      loadBalancer:
        servers:
          - url: "http://erpnext:8080"
    mail-service:
      loadBalancer:
        servers:
          - url: "http://postal:5000"
    cloud-service:
      loadBalancer:
        servers:
          - url: "http://nextcloud:80"
