http:
  routers:
    erp:
      rule: "Host(`${ERP_URL}`)"
      service: erp-service
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
    mail:
      rule: "Host(`${MAIL_URL}`)"
      service: mail-service
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
    cloud:
      rule: "Host(`${CLOUD_URL}`)"
      service: cloud-service
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
    http-to-https:
      rule: "HostRegexp(`.+`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: noop@internal
      priority: 1

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        port: "${HTTPS_PORT}"
        permanent: true

  services:
    erp-service:
      loadBalancer:
        servers:
          - url: "http://erpnext-frontend:8080"
    mail-service:
      loadBalancer:
        servers:
          - url: "http://postal-web:5000"
    cloud-service:
      loadBalancer:
        servers:
          - url: "http://nextcloud:80"
