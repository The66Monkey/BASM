http:
  routers:
    home:
      rule: "Host(`${PRIMARY_DOMAIN}`)"
      service: home-service
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
    erp:
      rule: "Host(`${ERP_URL}`)"
      service: erp-service
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
    mail:
      rule: "Host(`${MAIL_URL}`)"
      entryPoints:
        - websecure
      middlewares:
        - mail-canonical
      service: noop@internal
      tls:
        certResolver: letsencrypt
    cloud:
      rule: "Host(`${CLOUD_URL}`)"
      service: cloud-service
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
    http-to-https:
      rule: "HostRegexp(`.+`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: noop@internal
      priority: 1

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        port: "${HTTPS_PORT}"
        permanent: true
    mail-canonical:
      redirectRegex:
        regex: "^https?://[^/]+/(.*)"
        replacement: "https://${MAILBOX_HOSTNAME}/$1"
        permanent: true

  services:
    home-service:
      loadBalancer:
        servers:
          - url: "http://homepage:80"
    erp-service:
      loadBalancer:
        servers:
          - url: "http://erpnext-frontend:8080"
    cloud-service:
      loadBalancer:
        servers:
          - url: "http://nextcloud:80"

tcp:
  routers:
    mailbox:
      rule: "HostSNI(`${MAILBOX_HOSTNAME}`)"
      entryPoints:
        - websecure
      service: mailbox-service
      tls:
        passthrough: true
    mailbox-service-hosts:
      rule: >-
        HostSNI(`autoconfig.${PRIMARY_DOMAIN}`) ||
        HostSNI(`autodiscover.${PRIMARY_DOMAIN}`) ||
        HostSNI(`mta-sts.${PRIMARY_DOMAIN}`) ||
        HostSNI(`ua-auto-config.${PRIMARY_DOMAIN}`)
      entryPoints:
        - websecure
      service: mailbox-service
      tls:
        passthrough: true
  services:
    mailbox-service:
      loadBalancer:
        serversTransport: mailbox-proxy
        servers:
          - address: "stalwart-mail-proxy:8443"
  serversTransports:
    mailbox-proxy:
      proxyProtocol:
        version: 2
