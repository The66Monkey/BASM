<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{COMPANY}} - BASM</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; line-height: 1.6; }
    body { max-width: 62rem; margin: auto; padding: 2rem 1rem; }
    h1, h2 { line-height: 1.2; }
    nav ul { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; padding: 0; list-style: none; }
    nav a { display: block; padding: 1rem; border: 1px solid #888; border-radius: .5rem; }
    footer { margin-top: 2rem; }
  </style>
</head>
<body>
  <header>
    <img src="/mascot.png" alt="BASM mascot" width="200" height="200">
    <h1>Welcome to your BASM</h1>
    <p>Your business workspace for <strong>{{COMPANY}}</strong>.</p>
  </header>
  <main>
    <nav aria-label="BASM services">
      <h2>Open your services</h2>
      <ul>
{{SERVICES}}
      </ul>
    </nav>
    <p>Each service has its own sign-in. Ask your administrator for access.</p>
    <p>Documentation: <a href="https://github.com/The66Monkey/BASM">BASM on GitHub</a>.</p>
  </main>
  <footer>No passwords, tokens or private management addresses are shown here.</footer>
</body>
</html>
