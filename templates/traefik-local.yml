http:
  routers:
    home:
      rule: "Host(`home.${PRIMARY_DOMAIN}`)"
      service: home-service
      entryPoints:
        - web
    erp:
      rule: "Host(`${ERP_URL}`)"
      service: erp-service
      entryPoints:
        - web
    mail:
      rule: "Host(`${MAIL_URL}`)"
      middlewares:
        - mail-canonical
      service: noop@internal
      entryPoints:
        - web
    mailbox:
      rule: "Host(`${MAILBOX_HOSTNAME}`)"
      service: mailbox-service
      entryPoints:
        - web
    cloud:
      rule: "Host(`${CLOUD_URL}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`${BIND_ADDRESS}`)"
      service: cloud-service
      entryPoints:
        - web
  services:
    home-service:
      loadBalancer:
        servers:
          - url: "http://homepage:80"
    erp-service:
      loadBalancer:
        servers:
          - url: "http://erpnext-frontend:8080"
    mailbox-service:
      loadBalancer:
        servers:
          - url: "http://stalwart-mail:8080"
    cloud-service:
      loadBalancer:
        servers:
          - url: "http://nextcloud:80"
  middlewares:
    mail-canonical:
      redirectRegex:
        regex: "^https?://[^/]+/(.*)"
        replacement: "http://${MAILBOX_HOSTNAME}/$1"
        permanent: true